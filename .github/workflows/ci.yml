name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.check.outputs.api }}
      worker: ${{ steps.check.outputs.worker }}
      web: ${{ steps.check.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          [ -f apps/api/pyproject.toml ] && echo "api=true" >> "$GITHUB_OUTPUT" || echo "api=false" >> "$GITHUB_OUTPUT"
          [ -f apps/worker/pyproject.toml ] && echo "worker=true" >> "$GITHUB_OUTPUT" || echo "worker=false" >> "$GITHUB_OUTPUT"
          [ -f apps/web/package.json ] && echo "web=true" >> "$GITHUB_OUTPUT" || echo "web=false" >> "$GITHUB_OUTPUT"

  api:
    needs: detect
    if: needs.detect.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy .
      - name: Test
        run: uv run pytest --cov=app --cov-report=term-missing
      - name: Build image (validate only)
        run: docker build -t api:ci .

  worker:
    needs: detect
    if: needs.detect.outputs.worker == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest
      - name: Build image (validate only)
        run: docker build -t worker:ci .

  web:
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test -- --run
      - name: Build image (validate only)
        run: docker build -t web:ci .