name: Release

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.check.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          apps=()
          [ -f apps/api/Dockerfile ] && apps+=("api")
          [ -f apps/worker/Dockerfile ] && apps+=("worker")
          [ -f apps/web/Dockerfile ] && apps+=("web")
          json=$(printf '"%s",' "${apps[@]}")
          json="[${json%,}]"
          echo "apps=$json" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: detect
    if: needs.detect.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: ${{ fromJson(needs.detect.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.app }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: apps/${{ matrix.app }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}-${{ matrix.app }}:sha-${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"